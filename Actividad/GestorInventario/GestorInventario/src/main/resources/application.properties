spring.application.name=GestorInventario

# Metadata del endpoint. @app.version@ se genera desde project.version en build.gradle.
app.info.name=${spring.application.name}
app.info.version=@app.version@
app.info.description=API para gestionar el inventario
# Se escapa la tilde para que el texto se lea igual aunque cambie la codificación del archivo.
app.info.developer=Estudiante de Programaci\u00f3n Avanzada
app.info.email=estudiante@example.com
app.info.environment=${spring.profiles.active:default}

# Servidor: puerto HTTP y compresión de respuestas.
server.port=8080
server.compression.enabled=true

# Logging: nivel general y detalle del código propio.
logging.level.root=INFO
logging.level.com.example.GestorInventario=DEBUG

# Base de datos H2 en memoria para desarrollo del proyecto.
spring.datasource.url=jdbc:h2:mem:inventario;DB_CLOSE_DELAY=-1
spring.datasource.username=sa

# JSON: respuesta legible y omite valores nulos.
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Actuator: publicar health/info; ocultar detalles internos de health.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Seguridad: credenciales de ejemplo para los demás endpoints protegidos.
spring.security.user.name=admin
spring.security.user.password=admin

# La clave se proporciona por OPENAI_API_KEY; no guardes credenciales en este archivo.
openai.api-key=${OPENAI_API_KEY:}



